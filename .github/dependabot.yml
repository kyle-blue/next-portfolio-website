version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          minor-and-patch:
              update-types: [minor, patch]
    - package-ecosystem: terraform
      directory: /terraform
      schedule:
          interval: monthly

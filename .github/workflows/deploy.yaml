name: "Deploy"

# Builds the production image, pushes it to Artifact Registry and rolls the
# Cloud Run service to it. Infrastructure itself is applied by hand with
# Terraform (see terraform/README.md); this pipeline only ships new revisions.

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: portfolio-deploy
    cancel-in-progress: false

env:
    GCP_PROJECT: kyle-507414
    GCP_REGION: europe-west4
    REGISTRY: europe-west4-docker.pkg.dev/kyle-507414/container-repo
    IMAGE_NAME: portfolio-web
    CLOUD_RUN_SERVICE: kblue-portfolio
    PUBLIC_URL: https://kblue.io

jobs:
    qa:
        uses: ./.github/workflows/qa.yaml

    build:
        name: Build + push image
        runs-on: ubuntu-latest
        needs: qa
        permissions:
            contents: read
            id-token: write
        outputs:
            image_tag: ${{ steps.meta.outputs.tag }}
        steps:
            - uses: actions/checkout@v7

            - id: meta
              run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

            - name: Authenticate to GCP (Workload Identity Federation)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@v3

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

            - uses: docker/setup-buildx-action@v4

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  target: production
                  platforms: linux/amd64
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    deploy:
        name: Deploy to Cloud Run
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Authenticate to GCP (Workload Identity Federation)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@v3

            - name: Capture current revision (for rollback)
              id: prev
              run: |
                  PREV=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
                    --region=${{ env.GCP_REGION }} \
                    --project=${{ env.GCP_PROJECT }} \
                    --format='value(status.latestReadyRevisionName)')
                  echo "revision=${PREV}" >> "$GITHUB_OUTPUT"

            - name: Roll out new revision
              run: |
                  gcloud run services update ${{ env.CLOUD_RUN_SERVICE }} \
                    --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} \
                    --region=${{ env.GCP_REGION }} \
                    --project=${{ env.GCP_PROJECT }} \
                    --quiet

            - name: Smoke-check service URL
              id: health
              run: |
                  URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
                    --region=${{ env.GCP_REGION }} \
                    --project=${{ env.GCP_PROJECT }} \
                    --format='value(status.url)')
                  echo "service url: $URL"
                  for i in 1 2 3 4 5 6; do
                    CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
                    echo "attempt $i -> HTTP $CODE"
                    if [ "$CODE" = "200" ]; then exit 0; fi
                    sleep 5
                  done
                  echo "::error::Health check failed after 6 attempts"
                  exit 1

            - name: Smoke-check public domain (non-blocking)
              continue-on-error: true
              run: |
                  CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ env.PUBLIC_URL }}/" || true)
                  echo "${{ env.PUBLIC_URL }} -> HTTP $CODE"
                  if [ "$CODE" != "200" ]; then
                    echo "::warning::${{ env.PUBLIC_URL }} returned $CODE (DNS / certificate may still be propagating)"
                  fi

            - name: Rollback on health check failure
              if: failure() && steps.health.outcome == 'failure' && steps.prev.outputs.revision != ''
              run: |
                  echo "Rolling back to ${{ steps.prev.outputs.revision }}"
                  gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
                    --to-revisions=${{ steps.prev.outputs.revision }}=100 \
                    --region=${{ env.GCP_REGION }} \
                    --project=${{ env.GCP_PROJECT }}
